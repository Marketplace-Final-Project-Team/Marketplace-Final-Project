global:
  scrape_interval: 15s

scrape_configs:
  # Метрики самого Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Метрики сервера EC2: CPU, RAM, диск
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Перевірка доступності вебсайту
  - job_name: "blackbox-web"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://web:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
