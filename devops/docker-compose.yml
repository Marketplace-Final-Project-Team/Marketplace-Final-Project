services:

  # ===== SQL Server =====
    database:
      image: mcr.microsoft.com/mssql/server:2022-latest
      container_name: marketplace-db
      environment:
        ACCEPT_EULA: ${ACCEPT_EULA}
        MSSQL_PID: ${MSSQL_PID}
        MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      ports:
        - "${DB_PORT}:1433"
      volumes:
        - /opt/marketplace-data/mssql:/var/opt/mssql
      restart: unless-stopped

  # ===== Backend and Frontend =====
    web:
      build:
        context: ..
        dockerfile: devops/Dockerfile
      container_name: marketplace-web
      environment:
        ConnectionStrings__DefaultConnection: "Server=${DB_SERVER},${DB_PORT};Database=${DB_NAME};User ID=${DB_USER};Password=${DB_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      depends_on:
        - database
      restart: unless-stopped

  # ===== Nginx =====
    nginx:
      build: ./nginx
      container_name: marketplace-nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx/ssl:/etc/nginx/ssl:ro
      depends_on:
        web:
          condition: service_started
      restart: unless-stopped

  # ===== Other =====
